name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Set GitHub Pages base path
        run: echo "GITHUB_PAGES_BASE=/${{ github.event.repository.name }}/" >> $GITHUB_ENV
      - name: Set API base (from repository variable, optional)
        run: |
          if [ -n "${{ vars.VITE_API_BASE }}" ]; then
            echo "VITE_API_BASE=${{ vars.VITE_API_BASE }}" >> $GITHUB_ENV
            echo "Using backend API: ${{ vars.VITE_API_BASE }}"
          else
            echo "VITE_API_BASE not set — frontend will call /api relatively (set repo variable VITE_API_BASE to your backend URL)"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
