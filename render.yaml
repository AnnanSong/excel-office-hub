services:
  - type: web
    name: excel-office-hub-server
    runtime: docker
    dockerfilePath: ./packages/server/Dockerfile
    dockerContext: ./packages/server
    repo: https://github.com/AnnanSong/excel-office-hub.git
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: MAX_UPLOAD_SIZE
        value: "52428800"
      # 允许来自 GitHub Pages 前端的跨域请求（多个来源用逗号分隔）
      - key: CORS_ORIGINS
        value: https://annansong.github.io
      - key: PYTHONUNBUFFERED
        value: "1"
      # AI 能力（可选，留空则相关功能降级，不影响 Excel 处理）
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GLM_API_KEY
        sync: false
